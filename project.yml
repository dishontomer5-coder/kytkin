# P0-5: XcodeGen spec. Run `xcodegen generate` (or ./scripts/build.sh) to create Kytkin.xcodeproj.
# The .xcodeproj is generated and gitignored; edit this file instead.
name: Kytkin
options:
  bundleIdPrefix: io.github.kytkin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# P4-3: one-click updates. Sparkle (MIT, THIRD_PARTY_NOTICES.md), Kytkin's only code dependency, pinned to one exact
# release: a binary framework whose checksum Package.swift pins. Only Sources/System/Updates/SparkleUpdater.swift
# imports it (scripts/lint.sh).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # P4-3: Sparkle compares CURRENT_PROJECT_VERSION (CFBundleVersion, the appcast's sparkle:version), so raise it by
    # one for every release, together with MARKETING_VERSION.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Local ad-hoc signing: no Apple team needed. Developer ID signing comes in Phase 4.
    # P2-3: build.sh overrides CODE_SIGN_IDENTITY for Debug from KYTKIN_SIGN_IDENTITY.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Kytkin:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # P3-2: the bundled Public Suffix List (MPL-2.0, unmodified) and its license text, copied into
      # Contents/Resources. Refreshed only by scripts/update-psl; the app never downloads it.
      - path: Resources/PublicSuffixList
        buildPhase: resources
      # P4-3: Sparkle's licence (MIT, plus the notices of the code it includes), shipped with the framework.
      - path: Resources/Sparkle
        buildPhase: resources
      # P6-0c: the menu-bar glyphs (template PDFs), Resources/MenuBar/README.md. Only the PDFs are bundled; until
      # the real artwork lands the app draws SF Symbol placeholders.
      - path: Resources/MenuBar
        buildPhase: resources
        includes:
          - "*.pdf"
      # P6-0e: the app icon and the accent colour (#0E7A66), docs/design/artwork/Colors.md.
      # P6-0g: + the About icon (light and dark) and the dark accent (#2FA88B).
      - path: Resources/Assets.xcassets
      # P6-0g (design v2, Liquid Glass): the app icon as an Icon Composer package (letter-free, two glass halves).
      # actool builds Assets.car (macOS 26 glass, dark, clear and tinted) and AppIcon.icns (older macOS) from it; it
      # wins over the PNG set of the same name in Assets.xcassets, which stays as the hand-fitted fallback/source art.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    # P4-3: Sparkle.framework is embedded (and signed) in Contents/Frameworks.
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kytkin.Kytkin
        PRODUCT_NAME: Kytkin
        # P2-28: the Swift module stays "Kytkin" in both configs (Debug's product name has a space).
        PRODUCT_MODULE_NAME: Kytkin
        GENERATE_INFOPLIST_FILE: YES
        # P4-3: Sparkle's keys (feed, EdDSA public key, no automatic anything). Merged with the generated keys below.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_LSUIElement: YES # menu-bar only, no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: Kytkin
        # P2-3: shown in the Automation consent prompt (opt-in browser fallback, R3/R8).
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Kytkin asks the browser for the current tab's address, and whether the window is private, so it can switch to the language you use on that website. It never reads what's on the page."
        CODE_SIGN_ENTITLEMENTS: Config/Kytkin.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Kytkin contributors. MIT License."
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed for now: event taps / Accessibility need it (to be confirmed in P1-8).
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        # P6-0e: both configs (Debug keeps its own product name and bundle ID, the same icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # P2-3: Debug gets its own bundle ID and name, so its permission (TCC) entries never
        # replace a release build's. Release keeps io.github.kytkin.Kytkin / "Kytkin".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.kytkin.Kytkin.dev
          # P2-28: the product (bundle, CFBundleName, executable) is "Kytkin Dev.app" too, so System
          # Settings → Privacy & Security never lists two entries both called "Kytkin".
          PRODUCT_NAME: Kytkin Dev
          INFOPLIST_KEY_CFBundleDisplayName: Kytkin Dev
          # P2-53: no separate "<name>.debug.dylib" (Xcode's previews split). With the hardened runtime and a
          # self-signed cert (no Team ID), library validation refuses to load it and the app dies at launch
          # ("Library missing ... different Team IDs"). One binary has nothing to validate.
          ENABLE_DEBUG_DYLIB: NO
        Release:
          # P2-3: don't inject com.apple.security.get-task-allow (debugger attach) into Release;
          # notarization rejects it (R8 §2).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - KytkinTests
  KytkinTests:
    type: bundle.unit-test
    platform: macOS
    # P0-6: logic tests with no host app. The pure Core sources are compiled straight
    # into the test bundle, so tests never launch the menu-bar app.
    sources:
      - path: Tests/KytkinTests
        excludes:
          - Fixtures
      # P2-4: fixtures are copied as a folder (keeps sub-folders); tests load them via `Fixtures.url(_:)`.
      - path: Tests/KytkinTests/Fixtures
        type: folder
        buildPhase: resources
      - path: Sources/Core
      # P3-2: the test bundle carries its own copy of the list, so `PublicSuffixList.bundled` (which looks in
      # the bundle holding the Core code) finds it in tests exactly as it does in the app.
      - path: Resources/PublicSuffixList/public_suffix_list.dat
        buildPhase: resources
      # P2-15: the two tier-0 context adapters are tested with fake notifications on a private
      # NotificationCenter (never the real workspace one), so they're compiled in too. Listed one by
      # one on purpose: Phase 3 AX adapters landing in System/Context must not slip into the tests.
      - path: Sources/System/Context/ContextMonitor.swift
      - path: Sources/System/Context/WorkspaceAppActivationSource.swift
      # P2-16: only the manager's plumbing (fake probe/requester, private notification centers). Never add
      # SystemPermissionRequester here: it shows permission prompts and opens System Settings.
      - path: Sources/System/Permissions/PermissionsManager.swift
      # P2-17: KeyWatcher's plumbing is unit-tested with a fake backend. The real CGEventTap backend and the
      # convenience init that uses it are left out, so no test can install a tap or post an event.
      - path: Sources/System/Keyboard
        excludes:
          - CGEventTapBackend.swift
          - KeyWatcher+Live.swift
      # P2-19: ConflictDetector is tested the same way (private notification centers, fake app list and
      # preference read). Its reader is compiled in because it is the detector's default; the tests only
      # call it read-only. Listed one by one, like P2-15.
      - path: Sources/System/Platform/ConflictDetector.swift
      - path: Sources/System/Platform/PerDocumentInputReader.swift
      # P3-10: the AX thread, the watcher's hop logic, the engine (attach/detach/scheduler plumbing), the run-loop
      # timer and the AX error mapping are tested with a fake tree, a fake observer and a fake timer. Listed one by
      # one on purpose: AXElementTree, FrontmostObserver and BrowserWatcher+Live talk to real apps and must never be
      # compiled into the tests.
      - path: Sources/System/Browser/AXThread.swift
      - path: Sources/System/Browser/AXReadError+AXError.swift
      - path: Sources/System/Browser/BrowserWatchSeams.swift
      - path: Sources/System/Browser/BrowserWatchEngine.swift
      - path: Sources/System/Browser/BrowserWatcher.swift
      - path: Sources/System/Browser/RunLoopDeadlineTimer.swift
      # P4-3: the appcast writer behind scripts/make-appcast (a release tool, never in the app) is tested here.
      - path: Tools/make-appcast/Appcast.swift
      # P3-37: nothing from Sources/System/Text is listed, on purpose: SystemPasteboard (NSPasteboard.general),
      # CGEventKeyPoster and the AX adapters touch the real clipboard, post real events or read real apps. The clipboard
      # convert is tested through Core's ClipboardConvert with a fake pasteboard (Tests/KytkinTests/Text/ClipboardFakes).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kytkin.KytkinTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
