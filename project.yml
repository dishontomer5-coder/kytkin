# P0-5: XcodeGen spec. Run `xcodegen generate` (or ./scripts/build.sh) to create Kytkin.xcodeproj.
# The .xcodeproj is generated and gitignored; edit this file instead.
name: Kytkin
options:
  bundleIdPrefix: io.github.kytkin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Local ad-hoc signing: no Apple team needed. Developer ID signing comes in Phase 4.
    # P2-3: build.sh overrides CODE_SIGN_IDENTITY for Debug from KYTKIN_SIGN_IDENTITY.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Kytkin:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kytkin.Kytkin
        PRODUCT_NAME: Kytkin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES # menu-bar only, no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: Kytkin
        # P2-3: shown in the Automation consent prompt (opt-in browser fallback, R3/R8).
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Kytkin reads the address of the current browser tab to apply your per-website keyboard language. It never reads page content."
        CODE_SIGN_ENTITLEMENTS: Config/Kytkin.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed for now: event taps / Accessibility need it (to be confirmed in P1-8).
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # P2-3: Debug gets its own bundle ID and name, so its permission (TCC) entries never
        # replace a release build's. Release keeps io.github.kytkin.Kytkin / "Kytkin".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.kytkin.Kytkin.dev
          INFOPLIST_KEY_CFBundleDisplayName: Kytkin Dev
        Release:
          # P2-3: don't inject com.apple.security.get-task-allow (debugger attach) into Release;
          # notarization rejects it (R8 §2).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - KytkinTests
  KytkinTests:
    type: bundle.unit-test
    platform: macOS
    # P0-6: logic tests with no host app. The pure Core sources are compiled straight
    # into the test bundle, so tests never launch the menu-bar app.
    sources:
      - path: Tests/KytkinTests
        excludes:
          - Fixtures
      # P2-4: fixtures are copied as a folder (keeps sub-folders); tests load them via `Fixtures.url(_:)`.
      - path: Tests/KytkinTests/Fixtures
        type: folder
        buildPhase: resources
      - path: Sources/Core
      # P2-15: the two tier-0 context adapters are tested with fake notifications on a private
      # NotificationCenter (never the real workspace one), so they're compiled in too. Listed one by
      # one on purpose: Phase 3 AX adapters landing in System/Context must not slip into the tests.
      - path: Sources/System/Context/ContextMonitor.swift
      - path: Sources/System/Context/WorkspaceAppActivationSource.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kytkin.KytkinTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
